[package]
name = "rag_core"
version = "0.1.0"
edition = "2021"
authors = ["rag_core"]
description = "High-fidelity local RAG engine for financial and statistical documents with deterministic numeric guardrails"

[[bin]]
name = "rag_core"
path = "src/main.rs"

[lib]
name = "rag_core"
path = "src/lib.rs"
[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Regular expressions & Text processing
regex = "1.10"
unicode-normalization = "0.1"

# PDF Extraction
lopdf = "0.33"

# BM25 Lexical Search Engine
tantivy = "0.22"

# HTTP Client & Async Runtime
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI Parser
clap = { version = "4.5", features = ["derive"] }

# Hashing & Parallelism
sha2 = "0.10"
rayon = "1.10"

# CLI formatting & time
colored = "2.1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
